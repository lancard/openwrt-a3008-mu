name: Build ImageBuilder

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt tag or branch (예: v24.10.0, openwrt-24.10)"
        required: true
        default: "v24.10.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REF: ${{ inputs.openwrt_ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd ccache

      - name: Clone OpenWrt
        run: git clone --depth 1 --branch "$REF" https://github.com/openwrt/openwrt.git openwrt

      - name: Cache dl and ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: ib-${{ inputs.openwrt_ref }}-${{ github.run_id }}
          restore-keys: |
            ib-${{ inputs.openwrt_ref }}-

      - name: Apply custom files (overlay, patches)
        working-directory: openwrt
        run: |
          if [ -d ../config/overlay ]; then
            cp -a ../config/overlay/. .
          fi
          for p in ../config/patches/*.patch; do
            [ -e "$p" ] || continue
            echo "apply $p"
            git apply --whitespace=nowarn "$p"
          done

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          test -f ../config/diffconfig || { echo "config/diffconfig not found"; exit 1; }
          cp ../config/diffconfig .config
          printf 'CONFIG_IB=y\nCONFIG_CCACHE=y\n' >> .config
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Publish ImageBuilder to release
        run: |
          TAG="imagebuilder-$(echo "$REF" | tr '/' '-')"
          COMMIT=$(git -C openwrt rev-parse --short HEAD)
          IB=$(ls openwrt/bin/targets/*/*/openwrt-imagebuilder-* | head -n1)
          ASSETS=("$IB")
          for f in openwrt/bin/targets/*/*/config.buildinfo; do
            [ -e "$f" ] && ASSETS+=("$f")
          done
          NOTES="OpenWrt $REF ($COMMIT), built from ${GITHUB_SHA::7}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "ImageBuilder $REF" --notes "$NOTES"
          fi
